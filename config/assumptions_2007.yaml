# Judgement assumptions at 2007-12-31 (SPEC §7.1). Frozen at the lock (M4).
valuation_year: 2007
main_insurer: 1767
units: "USD thousands"

base_triangle: paid                 # M2 §1: paid/incurred stable; incurred used as cross-check
ldf:
  window: latest5                   # M2 §5; M4 pseudo-historical A/E does not discriminate (within 0.6%), M2 trend argument stands
  weighting: volume
  exclusions: []                    # M2 §3: keep all factors
tail:
  method: loglinear_mack            # M3: log-linear on (f - 1) of all-year factors, as MackChainLadder(tail = TRUE); recomputed at every valuation
  value: 1.002344                   # computed by the method at 2007; cross-checks: case_inc/paid AY 1998 at lag 10 = 1.00228; insurer's booked/paid 1.0029
  incurred: "paid tail x paid/case_inc of AY 1998 at lag 10 (consistent ultimate for the oldest AY)"
  sensitivity_multipliers: [0.5, 1.5]   # applied to (tail - 1)
selection_thresholds:               # on paid percent developed z = 1/CDF (tail included)
  cl_min_z: 0.70                    # z >= 70%: paid chain ladder
  bk_min_z: 0.30                    # 30% <= z < 70%: Benktander; z < 30%: BF
paid_vs_incurred_flag: 0.10         # |U_paid - U_inc| / U_paid > 10% needs a rationale
bf_prior: "leave-one-out Cape Cod ELR on paid"
peer_elr_check: "median panel_backtest ELR by AY; flag if prior differs by > 10 points"
elr_sensitivity_pp: 0.05
ulae:
  base: 0.05
  sensitivity: [0.03, 0.07]
confidence_levels:
  base: 0.75
  others: [0.65, 0.85, 0.90]
discount_curve:
  source: "GSW nominal zero-coupon (feds200628.csv), 2007-12-31 or last earlier trading day"
  illiquidity_premium: 0
  sensitivity_bp: 50
calendar_year_adjustment: none      # M2 §4; +2% a year sensitivity in M6

# Documented exceptions to the automatic thresholds (M4), main insurer only.
# Evidence (pre-lock): pseudo-historical valuations 2004-06 under-predicted paid diagonals to 2007 with paid CL on
# mature AYs (A/E 1.08-1.20); incurred CL on AYs with z >= 70% cut the total A/E to 1.03 / 1.09 / 1.02
# (outputs/m4_pseudo_historical*.csv, reports/diagnostics.md: paid/incurred ratio stable, heavier recent development).
exceptions:
  "1998": {method: CL_INC, reason: "incurred CL instead of paid CL; paid development has been getting heavier and incurred picked it up earlier in the 2004-06 pseudo-historical tests (A/E 1.02-1.09 vs 1.06-1.14)."}
